<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Duce-Anchovy's Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <link rel="stylesheet" href="/fx-animations.css">
    <link rel="stylesheet" href="/style.css">
    <style id="theme-vars">
:root, [data-theme="dark"] {
  --bg:          #282c34;
  --bg-darker:   #21252b;
  --bg-lighter:  #2c313c;
  --bg-hover:    #2c313a;
  --border:      #3e4451;
  --border-soft: rgba(62, 68, 81, 0.5);
  --fg:          #abb2bf;
  --fg-bright:   #e6e6e6;
  --fg-white:    #ffffff;
  --fg-subtle:   rgba(171,178,191,0.9);
  --muted:       #5c6370;
  --faint:       #4b5263;
  --blue:    #61afef;
  --purple:  #c678dd;
  --cyan:    #56b6c2;
  --green:   #98c379;
  --red:     #e06c75;
  --orange:  #d19a66;
  --yellow:  #e5c07b;
  --background:       var(--bg);
  --foreground:       var(--fg);
  --card:             rgba(255,255,255,0.03);
  --card-solid:       rgba(255,255,255,0.02);
  --card-foreground:  var(--fg);
  --popover:          rgba(255,255,255,0.05);
  --popover-foreground: var(--fg);
  --primary:          var(--blue);
  --primary-foreground: var(--bg-darker);
  --muted-bg:         rgba(255,255,255,0.04);
  --muted-foreground: var(--muted);
  --ring:             var(--blue);
  --ring-offset:      #282c34;
  --divider-color: #3e4451;
  --badge-gradient: linear-gradient(135deg, #61afef, #c678dd);
  --badge-shadow:   0 0 16px rgba(97,175,239,0.25);
  --title-gradient: linear-gradient(135deg, #61afef 0%, #c678dd 50%, #56b6c2 100%);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --selection-bg: rgba(97,175,239,0.25);
  --selection-fg: #fff;
  --navbar-bg: rgba(10,10,15,0.75);
  --navbar-bg-scrolled: rgba(10,10,15,0.92);
  --navbar-border: rgba(255,255,255,0.06);
  --navbar-border-scrolled: rgba(255,255,255,0.1);
  --avatar-glow: 0 0 20px rgba(97,175,239,0.2);
}

[data-theme="light"] {
  --bg:          #f0f2f5;
  --bg-darker:   #e4e7ec;
  --bg-lighter:  #ffffff;
  --bg-hover:    #e8ebf0;
  --border:      #d0d5dd;
  --border-soft: rgba(0, 0, 0, 0.08);
  --fg:          #4a5060;
  --fg-bright:   #1d2333;
  --fg-white:    #0d1219;
  --fg-subtle:   rgba(74,80,96,0.9);
  --muted:       #7b8194;
  --faint:       #9aa0b0;
  --blue:    #4080d0;
  --purple:  #9b5ec0;
  --cyan:    #3a90a0;
  --green:   #5ea038;
  --red:     #c84858;
  --orange:  #b87438;
  --yellow:  #b89040;
  --background:       var(--bg);
  --foreground:       var(--fg);
  --card:             rgba(0,0,0,0.025);
  --card-solid:       rgba(0,0,0,0.02);
  --card-foreground:  var(--fg);
  --popover:          rgba(0,0,0,0.04);
  --popover-foreground: var(--fg);
  --primary:          var(--blue);
  --primary-foreground: #ffffff;
  --muted-bg:         rgba(0,0,0,0.035);
  --muted-foreground: var(--muted);
  --ring:             var(--blue);
  --ring-offset:      #f0f2f5;
  --divider-color: #d0d5dd;
  --badge-gradient: linear-gradient(135deg, #4080d0, #9b5ec0);
  --badge-shadow:   0 4px 14px rgba(64,128,208,0.25);
  --title-gradient: linear-gradient(135deg, #4080d0 0%, #9b5ec0 50%, #3a90a0 100%);
  --selection-bg: rgba(64,128,208,0.2);
  --selection-fg: #1d2333;
  --navbar-bg: rgba(240,242,245,0.75);
  --navbar-bg-scrolled: rgba(240,242,245,0.95);
  --navbar-border: rgba(0,0,0,0.08);
  --navbar-border-scrolled: rgba(0,0,0,0.1);
  --avatar-glow: 0 0 16px rgba(64,128,208,0.2);
}

@theme inline {
  --color-background:       var(--bg);
  --color-foreground:       var(--fg);
  --color-card:             var(--card);
  --color-card-foreground:  var(--fg);
  --color-popover:          var(--popover);
  --color-popover-foreground: var(--fg);
  --color-primary:          var(--blue);
  --color-primary-foreground: var(--bg-darker);
  --color-muted:            var(--muted-bg);
  --color-muted-foreground: var(--muted);
  --color-border:           var(--border);
  --color-input:            var(--border);
  --color-ring:             var(--blue);
  --radius-sm: var(--radius-sm);
  --radius-md: var(--radius-md);
  --radius-lg: var(--radius-lg);
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Fira Code", Consolas, monospace;
}
::selection { background: var(--selection-bg); color: var(--selection-fg); }
html { scroll-behavior: smooth; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--bg);
    --color-foreground: var(--fg);
    --color-card-foreground: var(--fg);
    --color-popover-foreground: var(--fg);
    --color-primary: var(--blue);
    --color-primary-foreground: var(--bg-darker);
    --color-muted-foreground: var(--muted);
    --color-border: var(--border);
    --color-input: var(--border);
    --color-ring: var(--blue);
    --color-card: var(--card);
    --color-popover: var(--popover);
    --color-muted: var(--muted);
    --radius-sm: var(--radius-sm);
    --radius-md: var(--radius-md);
    --radius-lg: var(--radius-lg);
  }
  @layer base {
    body { background: var(--background); color: var(--foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--bg); }
      .text-background { color: var(--bg); }
      .border-background { border-color: var(--bg); }
      .ring-background { --tw-ring-color: var(--bg); }
      .bg-foreground { background-color: var(--fg); }
      .text-foreground { color: var(--fg); }
      .border-foreground { border-color: var(--fg); }
      .ring-foreground { --tw-ring-color: var(--fg); }
      .bg-card-foreground { background-color: var(--fg); }
      .text-card-foreground { color: var(--fg); }
      .border-card-foreground { border-color: var(--fg); }
      .ring-card-foreground { --tw-ring-color: var(--fg); }
      .bg-popover-foreground { background-color: var(--fg); }
      .text-popover-foreground { color: var(--fg); }
      .border-popover-foreground { border-color: var(--fg); }
      .ring-popover-foreground { --tw-ring-color: var(--fg); }
      .bg-primary { background-color: var(--blue); }
      .text-primary { color: var(--blue); }
      .border-primary { border-color: var(--blue); }
      .ring-primary { --tw-ring-color: var(--blue); }
      .bg-primary-foreground { background-color: var(--bg-darker); }
      .text-primary-foreground { color: var(--bg-darker); }
      .border-primary-foreground { border-color: var(--bg-darker); }
      .ring-primary-foreground { --tw-ring-color: var(--bg-darker); }
      .bg-muted-foreground { background-color: var(--muted); }
      .text-muted-foreground { color: var(--muted); }
      .border-muted-foreground { border-color: var(--muted); }
      .ring-muted-foreground { --tw-ring-color: var(--muted); }
      .bg-border { background-color: var(--border); }
      .text-border { color: var(--border); }
      .border-border { border-color: var(--border); }
      .ring-border { --tw-ring-color: var(--border); }
      .bg-input { background-color: var(--border); }
      .text-input { color: var(--border); }
      .border-input { border-color: var(--border); }
      .ring-input { --tw-ring-color: var(--border); }
      .bg-ring { background-color: var(--blue); }
      .text-ring { color: var(--blue); }
      .border-ring { border-color: var(--blue); }
      .ring-ring { --tw-ring-color: var(--blue); }
      .bg-card { background-color: var(--card); }
      .text-card { color: var(--card); }
      .border-card { border-color: var(--card); }
      .ring-card { --tw-ring-color: var(--card); }
      .bg-popover { background-color: var(--popover); }
      .text-popover { color: var(--popover); }
      .border-popover { border-color: var(--popover); }
      .ring-popover { --tw-ring-color: var(--popover); }
      .bg-muted { background-color: var(--muted); }
      .text-muted { color: var(--muted); }
      .border-muted { border-color: var(--muted); }
      .ring-muted { --tw-ring-color: var(--muted); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
    <style>
      /* 文章页：覆盖首页动态背景，使用简洁纯色 */
      [data-theme="dark"] body { background: #282c34; animation: none; }
      [data-theme="light"] body { background: #f0f2f5; animation: none; }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen relative overflow-hidden font-sans">
  <div class="fixed inset-0 pointer-events-none" style="z-index:0;">
    <div class="absolute top-[-10%] left-[-5%] w-[500px] h-[500px] rounded-full opacity-[0.10] blur-[130px]" style="background: radial-gradient(circle, var(--purple) 0%, transparent 70%);"></div>
    <div class="absolute top-[30%] right-[-10%] w-[500px] h-[500px] rounded-full opacity-[0.08] blur-[140px]" style="background: radial-gradient(circle, var(--blue) 0%, transparent 70%);"></div>
  </div>

  <nav class="fx-navbar relative">
    <div class="max-w-[700px] mx-auto px-6 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5 font-bold text-[16px] tracking-tight text-[var(--fg-white)]">
        <img src="img/avatar.png" alt="avatar" class="w-8 h-8 rounded-lg" style="box-shadow: var(--avatar-glow);">
        <span>duce-anchovy</span>
      </a>
      <a href="/" class="text-[13px] font-medium transition-colors hover:text-[var(--fg-white)] inline-flex items-center gap-1.5" style="color: var(--muted);">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> 返回首页
      </a>
    </div>
    <button id="theme-toggle" class="absolute right-6 top-1/2 -translate-y-1/2 w-10 h-10 flex items-center justify-center rounded-lg transition-all duration-300 hover:bg-white/[0.08]" style="color: var(--muted);" title="切换主题">
      <i data-lucide="sun" class="w-6 h-6 hidden" id="theme-icon-sun"></i>
      <i data-lucide="moon" class="w-6 h-6" id="theme-icon-moon"></i>
    </button>
  </nav>

  <div class="relative z-10">
    <article class="max-w-[700px] mx-auto px-6 py-12">
      <header class="mb-10 pb-8" style="border-bottom: 1px solid var(--border-soft);">
        <a href="/" class="fx-bounce-in fx-bounce-in-1 inline-flex items-center gap-1 text-[12px] mb-5 transition-colors" style="color: var(--muted);">
          <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i> 所有文章
        </a>
        <h1 class="fx-bounce-in fx-bounce-in-2 text-[32px] md:text-[40px] font-bold leading-[1.2] mb-5" style="color: var(--fg-bright); letter-spacing: -0.01em;">
          {{ page.title }}
        </h1>
        <div class="fx-bounce-in fx-bounce-in-3 flex items-center gap-3 flex-wrap text-[12px]">
          <time class="inline-flex items-center gap-1.5" style="color: var(--muted);">
            <i data-lucide="calendar" class="w-3.5 h-3.5"></i> {{ page.date | date: "%Y年%-m月%-d日" }}
          </time>
          <span style="color: var(--border);">·</span>
          <span class="inline-flex items-center gap-1.5" style="color: var(--{{ page.accent_color }});">
            <span class="w-1.5 h-1.5 rounded-full" style="background: var(--{{ page.accent_color }});"></span> {{ page.category }}
          </span>
          <span style="color: var(--border);">·</span>
          <span class="inline-flex items-center gap-1.5" style="color: var(--muted);">
            <i data-lucide="clock" class="w-3.5 h-3.5"></i> 约 {{ page.read_time }} 分钟读完
          </span>
        </div>
      </header>

      <div class="text-[15px] leading-[1.9]" style="color: var(--fg);">
        {{ content }}
      </div>
    </article>

    <nav class="max-w-[700px] mx-auto px-6 pb-12">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3" data-aos="fade-up">
        {% if page.previous %}
        <a href="{{ page.previous.url }}" class="block p-5 rounded-xl transition-all hover:translate-y-[-2px] group" style="background: var(--card-solid); border: 1px solid var(--border-soft);">
          <div class="flex items-center gap-1 text-[10px] mb-2 font-semibold uppercase tracking-[0.1em]" style="color: var(--muted);">
            <i data-lucide="arrow-left" class="w-3 h-3"></i> 上一篇
          </div>
          <p class="text-[14px] group-hover:text-[var(--fg-white)] transition-colors" style="color: var(--fg);">{{ page.previous.title }}</p>
        </a>
        {% endif %}
        {% if page.next %}
        <a href="{{ page.next.url }}" class="block p-5 rounded-xl transition-all hover:translate-y-[-2px] group text-right{% unless page.previous %} md:col-start-2{% endunless %}" style="background: var(--card-solid); border: 1px solid var(--border-soft);">
          <div class="flex items-center justify-end gap-1 text-[10px] mb-2 font-semibold uppercase tracking-[0.1em]" style="color: var(--muted);">
            下一篇 <i data-lucide="arrow-right" class="w-3 h-3"></i>
          </div>
          <p class="text-[14px] group-hover:text-[var(--fg-white)] transition-colors" style="color: var(--fg);">{{ page.next.title }}</p>
        </a>
        {% endif %}
      </div>
      <div class="mt-6 text-center" data-aos="fade-up">
        <a href="/" class="inline-flex items-center gap-1.5 text-[12px] transition-colors" style="color: var(--muted);">
          <i data-lucide="home" class="w-3.5 h-3.5"></i> 回到首页
        </a>
      </div>
    </nav>

    <footer class="border-t" style="border-color: var(--border-soft);" data-aos="fade-up">
      <div class="max-w-[700px] mx-auto px-6 py-8 text-center">
        <p class="text-[12px]" style="color: var(--muted);">&copy; Duce Agent</p>
      </div>
    </footer>
  </div>
</main>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="/fx-animations.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
