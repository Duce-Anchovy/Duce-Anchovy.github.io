<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#C45D3A"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#cl-bg)"/>
  <!-- Claude starburst/sunburst icon -->
  <g transform="translate(32,32)">
    <!-- 8 rays of varying thickness radiating from center -->
    <rect x="-2" y="-22" width="4" height="10" rx="2" fill="white" opacity="0.9"/>
    <rect x="-2" y="12" width="4" height="10" rx="2" fill="white" opacity="0.9"/>
    <rect x="-22" y="-2" width="10" height="4" rx="2" fill="white" opacity="0.9"/>
    <rect x="12" y="-2" width="10" height="4" rx="2" fill="white" opacity="0.9"/>
    <!-- Diagonal rays (thinner) -->
    <rect x="10" y="-20" width="3" height="8" rx="1.5" fill="white" opacity="0.7" transform="rotate(45, 11.5, -16)"/>
    <rect x="-20" y="10" width="3" height="8" rx="1.5" fill="white" opacity="0.7" transform="rotate(45, -18.5, 14)"/>
    <rect x="-18" y="-20" width="3" height="8" rx="1.5" fill="white" opacity="0.7" transform="rotate(-45, -16.5, -16)"/>
    <rect x="10" y="10" width="3" height="8" rx="1.5" fill="white" opacity="0.7" transform="rotate(-45, 11.5, 14)"/>
    <!-- Center circle -->
    <circle cx="0" cy="0" r="5" fill="white" opacity="0.9"/>
  </g>
</svg>